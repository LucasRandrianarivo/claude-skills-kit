name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # nginx -t is the only external checker the snippet verifier needs;
      # without it those blocks are reported as skipped rather than passing.
      - name: Install checkers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx-light shellcheck

      - name: Installer parses
        run: node --check bin/install.js

      - name: Snippets are valid
        run: node scripts/verify-snippets.mjs

      - name: Install scenarios
        run: node scripts/smoke-install.mjs
